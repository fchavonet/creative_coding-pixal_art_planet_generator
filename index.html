<!DOCTYPE html>
<html lang="en" class="h-full w-full m-0  overflow-hidden" data-theme="black">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pixel Art Planet Generator</title>

    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- DAISYUI -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5" type="text/css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- SCRIPT -->
    <script src="./script.js" defer></script>
</head>

<body class="h-full w-full m-0 bg-[#05070c]! text-[#e6e8ed]!overflow-hidden [color-scheme:dark]">
    <main class="h-full w-full">
        <!-- TOP CONTAINER -->
        <div class="fixed top-0 left-0 w-full h-auto p-4 flex flex-col justify-center items-start gap-4 z-2">
            <button id="generate-button" class="btn btn-warning btn-sm gap-2 shadow-none" type="button" data-theme="light">
                <i class="bi bi-arrow-repeat text-lg" aria-hidden="true"></i>
                Generate
            </button>

            <p class="text-xs">
                <span class="[@media(hover:none)_and_(pointer:coarse)]:hidden">You can press <kbd class="kbd mx-1 text-xs" data-theme="light">SPACE</kbd> to generate and move your your mouse to play with the light...</span>
                <span class="hidden [@media(hover:none)_and_(pointer:coarse)]:inline">Drag your finger to play with the light...</span>
            </p>
        </div>

        <p id="load-error" class="fixed top-22 left-8 right-8 p-2 text-xs text-black rounded bg-red-500 [&[hidden]]:hidden!" role="alert"></p>

        <canvas id="starfield" class="fixed inset-0 h-full w-full pointer-events-none" aria-hidden="true"></canvas>
        <canvas id="planet" class="fixed inset-0 h-full w-full pointer-events-auto touch-none [image-rendering:pixelated]" role="img" aria-label="Animated randomly generated pixel art planet"></canvas>

        <!-- BOTTOM CONTAINER -->
        <div class="fixed left-0 bottom-0 w-full h-auto p-4 flex flex-row justify-between items-center">
            <!-- GitHub link -->
            <a class="tooltip tooltip-right" data-tip="Click to visit the GitHub repository." href="https://github.com/fchavonet/creative_coding-pixal_art_planet_generator" target="_blank">
                <img src="https://img.shields.io/github/stars/fchavonet/creative_coding-pixal_art_planet_generator?style=social&label=GitHub%20Stars" alt="GitHub Stars">
            </a>

            <!-- PORTFOLIO LINK -->
            <a class="link link-hover text-xs" href="https://www.fchavonet.dev" target="_blank">
                www.fchavonet.dev
            </a>
        </div>
    </main>
</body>

</html>
